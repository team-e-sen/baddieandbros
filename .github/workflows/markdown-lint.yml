
name: Markdown Lint

on:
  push:
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Markdown Linter
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
